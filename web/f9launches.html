<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>F9 launches</title>
    <meta name="description" content="F9 launches 3d diagram">
    <meta name="author" content="Szabolcs Járay">

    <link rel="stylesheet" href="css/f9launches.css?v=1.05">
    <script src="js/f9launches.js"></script>
    <script src="js/launch.js"></script>
    <script src="js/booster.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r122/three.min.js" /></script>
    <script src="js/f9mountain.js"></script>
    <script src="js/mountainsplit.js"></script>
    <script src="js/boosterheight.js"></script>
    <script src="js/rollingaverage.js"></script>
    <script src="js/dataelement.js"></script>
    <script src="js/masstoorbit.js"></script>
    <script src="js/cadence.js"></script>
    <script src="js/boosterlineanim.js"></script>
    <script src="js/lc.js"></script>
    <script src="js/landing.js"></script>
    <script src="js/refurb.js"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TF1NSW65C2"></script>
</head>

<body onload="init();">
    <div id="content">
        <canvas width="3500" height="1800" id="canv" style="position:absolute;top:0px;left:0px;background-color: rgb(29, 29, 29);">
        </canvas>
        <div id="flightDataPopup" style="background-color: rgb(199, 199, 199);top:300px;left:200px;z-index:100;">
            <div id="closeFlightData">X</div>
        </div>
        <img id="target" src="pics/target.png" class="flyTarget">
        <a id="link"></a>
        <div id="nextDiv" class="buttonDiv" onclick="nextMode();">Next</div>
        <div id="saveDiv" class="buttonDiv" onclick="saveClick();">Save</div>
        <div id="dimDiv" class="buttonDiv" onclick="dimensionClick();">3D/2D</div>
        <div id="refreashDataDiv" class="buttonDiv" onclick="refreshData();">Refresh data</div>
        <!--div id="boosterLineAnim" class="buttonDiv" onclick="runBoosterLineAnim();">Booster anim</div-->
        <div id="HLDiv" class="buttonDiv">HL Booster: <input id="hlbooster" onchange="manualHighlightedBooster();"/></div>
    
        <div id="upDiv" class="buttonDiv" onclick="upButton();">UP</div>
        <div id="downDiv" class="buttonDiv" onclick="downButton();">DOWN</div>
        <div id="leftDiv" class="buttonDiv" onclick="leftButton();">LEFT</div>
        <div id="rightDiv" class="buttonDiv" onclick="rightButton();">RIGHT</div>
    </div>
    

</body>
</html>
